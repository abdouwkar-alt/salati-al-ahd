name: Android Signed Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (must match app versionName, e.g. v1.3.0)"
        required: true
        default: "v1.3.0"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate signing configuration and release version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d '"' -f 2)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then RELEASE_TAG="$INPUT_RELEASE_TAG"; else RELEASE_TAG="$GITHUB_REF_NAME"; fi
          if [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "Release tag $RELEASE_TAG does not match app version v$VERSION_NAME"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/salati-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/salati-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Generate third-party license report
        run: gradle :app:generateLicenseReport --no-parallel
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > app-release.sha256
      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: salati-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.sha256
            app/build/reports/dependency-license/
          retention-days: 90
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "الصلاة جامعة ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app-release.sha256
