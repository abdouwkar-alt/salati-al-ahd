name: Android CI
on:
  push:
    branches: [ main, "release/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate third-party license report
        run: gradle :app:generateLicenseReport --no-parallel
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build unsigned release variant for compile validation
        run: gradle assembleRelease
      - name: Upload test APK and license report
        uses: actions/upload-artifact@v4
        with:
          name: salati-ci-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/dependency-license/
          retention-days: 14
